spring:
  application:
    name: munot-hospital
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/munot_hospital?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: ${APP_TIMEZONE:Asia/Kolkata}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
  seed-demo: ${SEED_DEMO:false}
  translate:
    provider: ${TRANSLATE_PROVIDER:}
    url: ${TRANSLATE_API_URL:}
    api-key: ${TRANSLATE_API_KEY:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Hospital Admin}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  messaging:
    mail-from: ${MAIL_FROM:}
    whatsapp-api-url: ${WHATSAPP_API_URL:}
    whatsapp-api-token: ${WHATSAPP_API_TOKEN:}
    sms-api-url: ${SMS_API_URL:}
    sms-api-token: ${SMS_API_TOKEN:}
  reminder:
    day-before-hour: 18
    same-day-lead-minutes: 120
    poll-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
