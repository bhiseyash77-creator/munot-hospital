# Optional: local MySQL for development.   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: munot_hospital
      MYSQL_USER: munot_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports: ["3306:3306"]
    volumes: [munot_mysql:/var/lib/mysql]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
volumes:
  munot_mysql:
